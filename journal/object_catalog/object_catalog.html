<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PD Asset Catalog</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: #101820;
      --panel-2: #15202b;
      --border: #243447;
      --text: #e8eef6;
      --muted: #8aa0b5;
      --accent: #0ea5e9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background:
        radial-gradient(1000px 500px at 10% -10%, #0c3a52 0%, transparent 55%),
        radial-gradient(800px 400px at 90% 0%, #1a2040 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      background: rgba(7,11,18,.88); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 30;
    }
    header h1 { margin: 0; font-size: 1.12rem; letter-spacing: .01em; }
    header p { margin: .15rem 0 0; font-size: .78rem; color: var(--muted); }
    .status-row { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
    .status-pill {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .35rem .65rem; border-radius: 999px; font-size: .75rem;
      border: 1px solid var(--border); background: var(--panel);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: #4fd1a5; }
    .dot.bad { background: #ff6b6b; }
    .dot.live { background: #ffb347; animation: pulse 1.2s ease infinite; }
    @keyframes pulse { 50% { opacity: .45; } }

    main {
      --detail-pane-width: 480px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 12px var(--detail-pane-width);
      gap: 0;
      min-height: calc(100vh - 72px);
    }
    .pane-resizer {
      cursor: col-resize;
      touch-action: none;
      background: transparent;
      position: relative;
      z-index: 5;
      /* Wider invisible hit target than the visible grip line. */
      margin-left: -6px;
      margin-right: -6px;
      padding: 0 6px;
    }
    .pane-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: var(--border);
      border-radius: 2px;
      transition: background .15s ease, width .15s ease;
    }
    .pane-resizer:hover::after,
    .pane-resizer.dragging::after {
      width: 5px;
      background: var(--accent);
    }
    .pane-resizer::before {
      content: "⋮";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      line-height: 1;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, color .15s ease;
    }
    .pane-resizer:hover::before,
    .pane-resizer.dragging::before {
      opacity: 1;
      color: var(--accent);
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
      .pane-resizer { display: none; }
      aside { border-left: none !important; border-top: 1px solid var(--border); }
    }

    .workspace { padding: 1rem 1.25rem 2rem; min-width: 0; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: .6rem;
      margin-bottom: .85rem;
      align-items: end;
    }
    @media (max-width: 720px) {
      .toolbar { grid-template-columns: 1fr; }
    }
    label.field {
      display: flex; flex-direction: column; gap: .25rem;
      font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    }
    input[type="search"], select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: .5rem .65rem; font-size: .88rem; width: 100%;
    }
    input[type="search"]:focus, select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(14,165,233,.2);
    }

    .stats {
      display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: .75rem;
    }
    .stat {
      font-size: .74rem; font-family: var(--mono); padding: .25rem .55rem;
      border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
      background: rgba(0,0,0,.18);
    }

    .chip-row { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .85rem; }
    .chip {
      font-size: .76rem; padding: .32rem .7rem; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel-2);
      cursor: pointer; color: var(--muted);
      display: inline-flex; align-items: center; gap: .35rem;
    }
    .chip .count {
      font-family: var(--mono); font-size: .68rem; opacity: .85;
    }
    .chip.active {
      color: var(--text);
      border-color: var(--chip-color, var(--accent));
      background: color-mix(in srgb, var(--chip-color, var(--accent)) 18%, var(--panel-2));
      box-shadow: inset 3px 0 0 var(--chip-color, var(--accent));
    }

    .view-tabs { display: flex; gap: .35rem; margin-bottom: .85rem; flex-wrap: wrap; }
    .view-tab {
      border: 1px solid var(--border); background: var(--panel); color: var(--muted);
      border-radius: 999px; padding: .38rem .8rem; font-size: .8rem; cursor: pointer;
    }
    .view-tab.active { color: var(--text); border-color: var(--accent); background: #123048; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: .65rem;
    }
    .obj-card {
      border: 1px solid var(--border); border-radius: 12px; padding: .8rem .85rem;
      background: var(--panel-2); cursor: pointer;
      transition: border-color .15s, transform .1s, background .15s;
      border-left: 3px solid var(--tag-color, var(--border));
    }
    .obj-card:hover, .obj-card.selected {
      border-color: var(--accent);
      transform: translateY(-1px);
      background: #172636;
    }
    .obj-card .top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem;
      margin-bottom: .3rem;
    }
    .obj-card .tag {
      font-size: .72rem; font-weight: 600; color: var(--tag-color, var(--muted));
    }
    .obj-card .hex {
      font-size: .68rem; font-family: var(--mono); color: var(--muted);
      padding: .1rem .4rem; border: 1px solid var(--border); border-radius: 4px;
    }
    .obj-card .title { font-size: .95rem; font-weight: 600; margin: 0 0 .2rem; line-height: 1.25; }
    .obj-card .name {
      font-family: var(--mono); font-size: .7rem; color: #9ab0c8; margin-bottom: .45rem;
      word-break: break-all;
    }
    .footprint-bar {
      height: 8px; border-radius: 4px; background: rgba(255,255,255,.06);
      overflow: hidden; margin-bottom: .35rem;
    }
    .footprint-bar > span {
      display: block; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--tag-color, var(--accent)), color-mix(in srgb, var(--tag-color, var(--accent)) 40%, #fff));
      min-width: 4px;
    }
    .obj-card .meta {
      font-family: var(--mono); font-size: .68rem; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: .35rem .55rem;
    }

    .table-wrap {
      overflow: auto; border: 1px solid var(--border); border-radius: 12px;
      background: var(--panel);
    }
    table {
      width: 100%; border-collapse: collapse; font-size: .82rem;
    }
    th, td {
      text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      position: sticky; top: 0; background: #121c28; color: var(--muted);
      font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; z-index: 1;
    }
    tr { cursor: pointer; }
    tr:hover td { background: rgba(14,165,233,.08); }
    tr.selected td { background: rgba(14,165,233,.14); }
    .tag-pill {
      display: inline-flex; align-items: center; gap: .25rem;
      padding: .12rem .45rem; border-radius: 999px; font-size: .72rem;
      border: 1px solid color-mix(in srgb, var(--tag-color) 50%, var(--border));
      color: var(--tag-color);
      background: color-mix(in srgb, var(--tag-color) 12%, transparent);
    }
    .mono { font-family: var(--mono); font-size: .78rem; color: #a8bdd0; }

    .footprint-board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: .55rem;
    }
    .fp-cell {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .fp-cell:hover, .fp-cell.selected { border-color: var(--accent); }
    .fp-box {
      background: color-mix(in srgb, var(--tag-color, var(--accent)) 55%, transparent);
      border: 1px solid color-mix(in srgb, var(--tag-color, var(--accent)) 80%, #fff);
      border-radius: 3px;
      box-shadow: 0 0 12px color-mix(in srgb, var(--tag-color, var(--accent)) 30%, transparent);
    }
    .fp-cell .fp-label {
      position: absolute; left: 4px; right: 4px; bottom: 4px;
      font-size: .58rem; color: var(--muted); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .museum-map {
      position: relative; width: 100%; max-width: 900px; aspect-ratio: 1.2;
      background: linear-gradient(180deg, #0a121a 0%, #101820 100%);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    .museum-region {
      position: absolute; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      background: color-mix(in srgb, var(--region-color, #0ea5e9) 18%, transparent);
    }
    .museum-region .region-label {
      position: absolute; left: 6px; top: 4px;
      font-size: .68rem; color: var(--text); font-weight: 600;
      text-shadow: 0 1px 2px #000;
    }
    .museum-dot {
      position: absolute; width: 5px; height: 5px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--dot-color, #0ea5e9);
      box-shadow: 0 0 6px var(--dot-color, #0ea5e9);
      cursor: pointer;
    }
    .museum-dot:hover, .museum-dot.selected {
      width: 9px; height: 9px; z-index: 2;
      outline: 2px solid #fff;
    }
    .museum-hint { color: var(--muted); font-size: .8rem; margin: .5rem 0 0; }

    aside {
      border-left: 1px solid var(--border);
      background: rgba(10,16,24,.92);
      padding: 1rem 1.1rem 2rem;
      position: sticky; top: 72px; align-self: start;
      max-height: calc(100vh - 72px); overflow: auto;
      min-width: 0;
    }
    aside h2 { margin: 0 0 .5rem; font-size: .95rem; }
    aside .empty {
      color: var(--muted); font-size: .84rem; line-height: 1.45;
      padding: .75rem 0;
    }
    .detail-block {
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel); padding: .75rem .85rem; margin-bottom: .65rem;
    }
    .detail-block h3 {
      margin: 0 0 .45rem; font-size: .72rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .detail-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 .2rem; }
    .detail-name { font-family: var(--mono); font-size: .75rem; color: #9ab0c8; word-break: break-all; }
    .kv { display: grid; grid-template-columns: 96px 1fr; gap: .3rem .5rem; font-size: .8rem; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-family: var(--mono); color: #c8d8e8; word-break: break-all; }
    .viewer-stage {
      position: relative;
      height: clamp(360px, 58vh, 840px);
      min-height: 320px;
      border-radius: 10px; border: 1px solid var(--border);
      background:
        radial-gradient(circle at 50% 20%, #16324a 0%, #0a121a 55%, #070b10 100%);
      margin-bottom: .65rem;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .viewer-stage canvas {
      display: block; width: 100%; height: 100%;
      cursor: grab;
    }
    .viewer-stage canvas:active { cursor: grabbing; }
    .viewer-hint {
      position: absolute; left: 8px; bottom: 6px; right: 8px;
      font-size: .68rem; color: rgba(200, 220, 240, .7);
      pointer-events: none;
    }
    .viewer-status {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .82rem; color: var(--muted);
      pointer-events: none;
      background: rgba(7, 11, 18, .35);
    }
    .viewer-status.hidden { display: none; }
    .copy-row { display: flex; flex-wrap: wrap; gap: .4rem; }
    button.copy {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      border-radius: 8px; padding: .4rem .65rem; font-size: .78rem; cursor: pointer;
    }
    button.copy:hover { border-color: var(--accent); }
    .error-banner {
      margin: 1rem 1.25rem; padding: .85rem 1rem; border-radius: 10px;
      border: 1px solid #5a2a2a; background: #2a1418; color: #ffb4b4;
      display: none;
    }
    .error-banner.show { display: block; }
    .play-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .play-controls button {
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }
    .play-slider-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }
    .play-slider {
      flex: 1;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .play-frame-label {
      font-family: var(--mono);
      font-size: 0.76rem;
      min-width: 5.5rem;
      text-align: right;
      color: var(--muted);
    }
    .chr-select-row {
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PD Asset Catalog</h1>
      <p>Props, weapons, characters, and other game assets</p>
    </div>
    <div class="status-row">
      <span class="status-pill"><span class="dot" id="healthDot"></span><span id="healthLabel">Connecting…</span></span>
      <span class="status-pill" id="countPill">— models</span>
    </div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <main>
    <div class="workspace">
      <div class="toolbar">
        <label class="field">Search
          <input type="search" id="searchInput" placeholder="Name, MODEL_*, hex, tag…" autocomplete="off">
        </label>
        <label class="field">Sort
          <select id="sortSelect">
            <option value="model">Model id</option>
            <option value="label">Label</option>
            <option value="tag">Tag</option>
            <option value="width">Width</option>
            <option value="depth">Depth</option>
            <option value="area">Footprint area</option>
            <option value="scale">Scale</option>
          </select>
        </label>
        <label class="field">Order
          <select id="orderSelect">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </label>
      </div>

      <div class="stats" id="statsRow"></div>
      <div class="chip-row" id="tagChips"></div>

      <div class="view-tabs">
        <button type="button" class="view-tab active" data-view="grid">Cards</button>
        <button type="button" class="view-tab" data-view="table">Table</button>
        <button type="button" class="view-tab" data-view="footprint">Footprints</button>
        <button type="button" class="view-tab" data-view="museum">Museum map</button>
      </div>

      <div id="viewRoot"></div>
    </div>

    <div class="pane-resizer" id="paneResizer" role="separator" aria-orientation="vertical"
         aria-label="Resize details panel" tabindex="0"></div>

    <aside id="detailPane">
      <h2>Details</h2>
      <div class="empty" id="detailEmpty">Select a model to view its 3D mesh, scale, and bbox footprint.</div>
      <div id="detailBody" hidden></div>
    </aside>
  </main>

  <script src="mesh_shaders.inc.js"></script>
  <script src="mesh_viewer.js"></script>
  <script>
    const state = {
      catalog: null,
      layout: null,
      animationsCatalog: null,
      category: "props",
      tag: "all",
      query: "",
      view: "grid",
      sort: "label",
      order: "asc",
      selected: null,
      maxFootprint: 1,
    };

    let detailViewerState = null;
    let playTimer = null;
    let playFrame = 0;
    let playing = false;
    let meshCache = {};
    let currentAnimIndex = null;
    let activePreviewChr = 'dark_combat';

    function stopAnimPlayback() {
      playing = false;
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
      const btn = document.getElementById('btnPlayPause');
      if (btn) btn.textContent = '▶ Play';
    }

    function startAnimPlayback(a) {
      if (playing) return;
      playing = true;
      const btn = document.getElementById('btnPlayPause');
      if (btn) btn.textContent = '⏸ Pause';

      playTimer = setInterval(() => {
        if (!playing) return;
        playFrame = (playFrame + 1) % a.numframes;
        loadAndRenderFrame(a.index, playFrame);
      }, 100);
    }

    async function loadAndRenderFrame(animIndex, frameIndex) {
      if (currentAnimIndex !== animIndex) return;
      const cacheKey = `${activePreviewChr}:${animIndex}:${frameIndex}`;
      const statusEl = document.getElementById('viewerStatus');
      const metaEl = document.getElementById('meshMeta');
      
      const slider = document.getElementById('playSlider');
      const label = document.getElementById('playFrameLabel');
      if (slider) slider.value = frameIndex;
      if (label) {
        const anim = state.selected;
        const total = anim ? anim.numframes : 1;
        label.textContent = `Fr ${frameIndex} / ${total - 1}`;
      }

      let mesh = meshCache[cacheKey];
      if (!mesh) {
        try {
          const res = await fetch(`/api/mesh?chr=${activePreviewChr}&anim=${animIndex}&frame=${frameIndex}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const payload = await res.json();
          if (!payload.ok || !payload.vertexCount) throw new Error(payload.error || 'No mesh data');
          mesh = ObjectCatalogMeshViewer.normalizeMesh(payload);
          meshCache[cacheKey] = mesh;
        } catch (err) {
          if (currentAnimIndex !== animIndex) return;
          if (statusEl) {
            statusEl.textContent = `Error: ${err.message}`;
            statusEl.classList.remove('hidden');
          }
          return;
        }
      }

      if (currentAnimIndex !== animIndex) return;
      if (statusEl) statusEl.classList.add('hidden');
      if (metaEl) {
        metaEl.textContent = `${mesh.vertexCount} verts · ${mesh.triangleCount} tris`;
      }

      if (meshViewer) {
        ObjectCatalogMeshViewer.uploadMesh(meshViewer, mesh);
        ObjectCatalogMeshViewer.drawFrame(meshViewer);
      }
    }

    const els = {
      healthDot: document.getElementById("healthDot"),
      healthLabel: document.getElementById("healthLabel"),
      countPill: document.getElementById("countPill"),
      errorBanner: document.getElementById("errorBanner"),
      searchInput: document.getElementById("searchInput"),
      sortSelect: document.getElementById("sortSelect"),
      orderSelect: document.getElementById("orderSelect"),
      statsRow: document.getElementById("statsRow"),
      tagChips: document.getElementById("tagChips"),
      viewRoot: document.getElementById("viewRoot"),
      detailEmpty: document.getElementById("detailEmpty"),
      detailBody: document.getElementById("detailBody"),
    };

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showError(message) {
      els.errorBanner.textContent = message;
      els.errorBanner.classList.add("show");
    }

    function clearError() {
      els.errorBanner.classList.remove("show");
      els.errorBanner.textContent = "";
    }

    async function api(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`${path} → HTTP ${res.status}`);
      return res.json();
    }

    function categoryPayload() {
      if (state.category === "animations") {
        return {
          id: "animations",
          title: "Animations",
          icon: "🎬",
          color: "#f472b6",
          count: state.animationsCatalog?.namedCount || 0,
          tags: (state.animationsCatalog?.allSections || []).map(sec => ({
            id: sec.id,
            label: sec.title,
            icon: sec.icon,
            color: sec.color,
            count: sec.count
          }))
        };
      }
      const cats = state.catalog?.categories || [];
      return cats.find((c) => c.id === state.category) || cats[0] || null;
    }

    function allAssets() {
      if (state.category === "animations") {
        if (!state.animationsCatalog) return [];
        const sections = state.animationsCatalog.allSections || [];
        return sections.flatMap(sec => sec.animations || []);
      }
      const cat = categoryPayload();
      return (cat?.assets || state.catalog?.models || []).slice();
    }

    function filteredModels() {
      if (!state.catalog) return [];
      let models = allAssets();
      if (state.tag !== "all") {
        models = models.filter((m) => {
          if (state.category === "animations") {
            return m.category === state.tag;
          }
          return m.tag === state.tag;
        });
      }
      const q = state.query.trim().toLowerCase();
      if (q) {
        const tokens = q.split(/\s+/).filter(Boolean);
        models = models.filter((m) => {
          if (state.category === "animations") {
            const hay = [
              m.id, m.label, m.indexHex, m.category, m.categoryTitle, m.file, m.hint, m.usage, String(m.index ?? ""),
            ].join(" ").toLowerCase();
            return tokens.every((t) => hay.includes(t));
          }
          const hay = [
            m.name, m.label, m.modelHex, m.tag, m.tagLabel, m.bboxSource,
            m.sourcePath, m.category, m.id, String(m.model ?? ""),
          ].join(" ").toLowerCase();
          return tokens.every((t) => hay.includes(t));
        });
      }
      const dir = state.order === "desc" ? -1 : 1;
      const key = state.category === "animations" && state.sort === "model" ? "index" : state.sort;
      models.sort((a, b) => {
        const av = a[key];
        const bv = b[key];
        if (typeof av === "string" || typeof bv === "string") {
          return String(av || "").localeCompare(String(bv || "")) * dir;
        }
        return ((Number(av) || 0) - (Number(bv) || 0)) * dir;
      });
      return models;
    }

      const el = document.getElementById("viewerStatus");

        el.textContent = "";
        return;
      }
      el.classList.remove("hidden");
      el.textContent = text;

    async function loadMeshForModel(asset) {
      const token = ++meshViewer.loadToken;
      const canvas = document.getElementById("meshCanvas");
      if (!canvas) return;
      setViewerStatus("Loading 3D model…");
      try {
        const gl = initMeshViewer(canvas);
        if (!gl) {
          setViewerStatus("WebGL unavailable in this window");
          return;
        }
        let url = "";
        if (asset?.id) {
          url = `/api/mesh?asset=${encodeURIComponent(asset.id)}`;
        } else if (asset?.sourcePath || asset?.bboxSource) {
          url = `/api/mesh?source=${encodeURIComponent(asset.sourcePath || asset.bboxSource)}`;
        } else if (asset?.model != null) {
          url = `/api/mesh/${asset.model}`;
        } else {
          setViewerStatus("No mesh source for this asset");
          return;
        }
        const mesh = await api(url);
        if (token !== meshViewer.loadToken) return;
        if (!mesh.ok || !mesh.vertexCount) {
          setViewerStatus(mesh.error || "No mesh data");
          return;
        }
        uploadMesh(mesh);
        setViewerStatus("");
        const meta = document.getElementById("meshMeta");
        if (meta) {
          const texCount = (mesh.textures || []).length;
          const groupCount = (mesh.groups || []).length;
          meta.textContent = `${mesh.vertexCount} verts · ${mesh.triangleCount} tris`
            + (texCount ? ` · ${texCount} tex` : " · untextured")
            + (groupCount > 1 ? ` · ${groupCount} layers` : "");
        }
      } catch (err) {
        if (token !== meshViewer.loadToken) return;
        setViewerStatus(err?.message || "Failed to load mesh");
      }
    }

    function projectMuseum(x, z, bounds) {
      const { minX, maxX, minZ, maxZ } = bounds;
      const left = ((x - minX) / Math.max(1, maxX - minX)) * 100;
      const top = ((z - minZ) / Math.max(1, maxZ - minZ)) * 100;
      return {
        left: `${Math.min(99, Math.max(1, left))}%`,
        top: `${Math.min(99, Math.max(1, top))}%`,
      };
    }

    function renderMuseum(models) {
      const layout = state.layout;
      if (!layout) {
        els.viewRoot.innerHTML = `<p class="museum-hint">Museum layout unavailable.</p>`;
        return;
      }
      const districts = layout.tagDistricts || [];
      const props = layout.props || [];
      const shownIds = new Set(models.map((m) => m.model));
      const visibleProps = props.filter((p) => shownIds.has(p.model));

      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      const expand = (x, z, half = 0) => {
        minX = Math.min(minX, x - half);
        maxX = Math.max(maxX, x + half);
        minZ = Math.min(minZ, z - half);
        maxZ = Math.max(maxZ, z + half);
      };
      districts.forEach((d) => expand(d.centerX, d.centerZ, d.half || d.carpetHalf || 0));
      visibleProps.forEach((p) => expand(p.x, p.z, 40));
      if (!Number.isFinite(minX)) {
        expand(layout.hubX || layout.centerX || 0, layout.hubZ || layout.centerZ || 0, layout.half || 1200);
      }
      const pad = Math.max(200, (maxX - minX) * 0.04);
      const bounds = { minX: minX - pad, maxX: maxX + pad, minZ: minZ - pad, maxZ: maxZ + pad };

      const regions = districts.map((d) => {
        const half = d.half || d.carpetHalf || 0;
        const x0 = ((d.centerX - half - bounds.minX) / (bounds.maxX - bounds.minX)) * 100;
        const z0 = ((d.centerZ - half - bounds.minZ) / (bounds.maxZ - bounds.minZ)) * 100;
        const w = ((half * 2) / (bounds.maxX - bounds.minX)) * 100;
        const h = ((half * 2) / (bounds.maxZ - bounds.minZ)) * 100;
        return `<div class="museum-region" style="left:${x0}%;top:${z0}%;width:${w}%;height:${h}%;--region-color:${esc(d.color)}">
          <div class="region-label">${esc(d.icon || "")} ${esc(d.label)} (${d.count || 0})</div>
        </div>`;
      }).join("");

      const dots = visibleProps.map((p) => {
        const pt = projectMuseum(p.x, p.z, bounds);
        const color = p.tagColor || state.catalog?.tagMeta?.[p.tag]?.color || "#0ea5e9";
        return `<div class="museum-dot ${state.selected?.model === p.model ? "selected" : ""}"
          data-model="${p.model}" style="left:${pt.left};top:${pt.top};--dot-color:${esc(color)}"
          title="${esc(p.label)} (${esc(p.modelHex)})"></div>`;
      }).join("");

      els.viewRoot.innerHTML = `
        <div class="museum-map">${regions}${dots}</div>
        <p class="museum-hint">
          Anim Lab W wing — hub (${Math.round(layout.hubX || layout.centerX || 0)},
          ${Math.round(layout.hubZ || layout.centerZ || 0)}) ·
          ${visibleProps.length} props shown · ${districts.length} tag districts
        </p>
      `;
      bindModelClicks(els.viewRoot);
    }

    function renderAll() {
      const models = filteredModels();
      renderStats(models);
      renderChips();
      if (state.view === "table") renderTable(models);
      else if (state.view === "footprint") renderFootprints(models);
      else if (state.view === "museum") renderMuseum(models);
      else renderGrid(models);
      renderDetail();
    }

    document.querySelectorAll(".view-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        state.view = tab.getAttribute("data-view") || "grid";
        document.querySelectorAll(".view-tab").forEach((t) => {
          t.classList.toggle("active", t === tab);
        });
        renderAll();
      });
    });

    let searchTimer = null;
    els.searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.query = els.searchInput.value;
        renderAll();
      }, 80);
    });
    els.sortSelect.addEventListener("change", () => {
      state.sort = els.sortSelect.value;
      renderAll();
    });
    els.orderSelect.addEventListener("change", () => {
      state.order = els.orderSelect.value;
      renderAll();
    });

    async function bootstrap() {
      try {
        if (window.objectCatalogAPI?.ensureServer) {
          els.healthDot.className = "dot live";
          els.healthLabel.textContent = "Starting server…";
          await window.objectCatalogAPI.ensureServer();
        }
        const health = await api("/api/health");
        const service = health.service || health.legacyService;
        if (!health.ok || (service !== "asset-catalog" && service !== "object-catalog")) {
          throw new Error("Unexpected health payload");
        }
        setHealth(true, "Server ready");
        clearError();

        const catalog = await api("/api/catalog");
        state.catalog = catalog;
        state.category = catalog.categoryOrder?.[0] || "props";
        const footprints = (catalog.categories || [])
          .flatMap((c) => c.assets || [])
          .map((m) => Number(m.footprint) || 0);
        state.maxFootprint = Math.max(1, ...footprints);

        // Fetch animations catalog asynchronously
        api("/api/catalog/animations")
          .then((animCatalog) => {
            state.animationsCatalog = animCatalog;
            renderChips();
          })
          .catch((err) => {
            console.error("Failed to load animations catalog", err);
          });

        try {
          const layoutRes = await api("/api/layout");
          state.layout = layoutRes.layout || null;
          // Attach tag colors onto layout props for museum dots.
          if (state.layout?.props) {
            const byModel = new Map((catalog.models || []).map((m) => [m.model, m]));
            state.layout.props = state.layout.props.map((p) => {
              const row = byModel.get(p.model);
              return {
                ...p,
                tagColor: row?.tagColor || state.layout.tagMeta?.[p.tag]?.color,
              };
            });
          }
        } catch (err) {
          console.warn("layout load failed", err);
          state.layout = null;
        }

        renderAll();
        // Show a real mesh immediately so the catalog is not metadata-only.
        if (!state.selected) {
          const first = filteredModels()[0];
          if (first) selectModel(first);
        }
      } catch (err) {
        setHealth(false, "Server error");
        showError(`Failed to load object catalog: ${err?.message || err}`);
      }
    }

    const DETAIL_PANE_WIDTH_KEY = "objectCatalog.detailPaneWidth";

    function initDetailPaneResize() {
      const main = document.querySelector("main");
      const resizer = document.getElementById("paneResizer");
      if (!main || !resizer) return;

      const saved = Number(localStorage.getItem(DETAIL_PANE_WIDTH_KEY));
      if (Number.isFinite(saved) && saved >= 320 && saved <= 1200) {
        main.style.setProperty("--detail-pane-width", `${Math.round(saved)}px`);
      }

      let dragging = false;
      const onMove = (ev) => {
        if (!dragging) return;
        const rect = main.getBoundingClientRect();
        const width = Math.round(
          Math.min(1200, Math.max(320, rect.right - (ev.clientX ?? 0)))
        );
        main.style.setProperty("--detail-pane-width", `${width}px`);
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        const width = Number.parseFloat(
          getComputedStyle(main).getPropertyValue("--detail-pane-width")
        );
        if (Number.isFinite(width)) {
          localStorage.setItem(DETAIL_PANE_WIDTH_KEY, String(Math.round(width)));
        }
      };

      resizer.addEventListener("pointerdown", (ev) => {
        if (window.matchMedia("(max-width: 960px)").matches) return;
        ev.preventDefault();
        dragging = true;
        resizer.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
        try { resizer.setPointerCapture(ev.pointerId); } catch { /* Electron fallback */ }
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      });
      // Legacy mouse path for older WebKit/Electron builds without reliable pointer capture.
      resizer.addEventListener("mousedown", (ev) => {
        if (ev.button !== 0 || window.matchMedia("(max-width: 960px)").matches) return;
        ev.preventDefault();
        dragging = true;
        resizer.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
        const onMouseMove = (moveEv) => onMove(moveEv);
        const onMouseUp = () => {
          onUp();
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseup", onMouseUp);
        };
        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
      });

      resizer.addEventListener("dblclick", (ev) => {
        ev.preventDefault();
        main.style.setProperty("--detail-pane-width", "480px");
        localStorage.setItem(DETAIL_PANE_WIDTH_KEY, "480");
      });

      resizer.addEventListener("keydown", (ev) => {
        const step = ev.shiftKey ? 48 : 16;
        const mainEl = document.querySelector("main");
        if (!mainEl) return;
        let width = Number.parseFloat(
          getComputedStyle(mainEl).getPropertyValue("--detail-pane-width")
        );
        if (!Number.isFinite(width)) width = 420;
        if (ev.key === "ArrowLeft") width = Math.min(1200, width + step);
        else if (ev.key === "ArrowRight") width = Math.max(320, width - step);
        else return;
        ev.preventDefault();
        mainEl.style.setProperty("--detail-pane-width", `${Math.round(width)}px`);
        localStorage.setItem(DETAIL_PANE_WIDTH_KEY, String(Math.round(width)));
      });
    }

    initDetailPaneResize();
    bootstrap();
  </script>
</body>
</html>
